---
image:
  repository: ghcr.io/ministryofjustice/hmpps-veracode-discovery
  tag: xxx

discoveryCronJob:
  namespace_secrets:
    hmpps-veracode-discovery:
      SERVICE_CATALOGUE_API_ENDPOINT: "SERVICE_CATALOGUE_API_ENDPOINT"
      SERVICE_CATALOGUE_API_KEY: "SERVICE_CATALOGUE_API_KEY"
      VERACODE_API_KEY_ID: "VERACODE_API_KEY_ID"
      VERACODE_API_KEY_SECRET: "VERACODE_API_KEY_SECRET"
    hmpps-sre-app-slack-bot:
      SLACK_BOT_TOKEN: "SLACK_BOT_TOKEN"
    hmpps-envoy-https-proxy-env:
      HTTP_PROXY: "HTTP_PROXY"
      HTTPS_PROXY: "HTTPS_PROXY"
      NO_PROXY: "NO_PROXY"
      http_proxy: "HTTP_PROXY"
      https_proxy: "HTTPS_PROXY"
      no_proxy: "NO_PROXY"

generic-prometheus-alerts:
  targetApplication: hmpps-veracode-discovery
